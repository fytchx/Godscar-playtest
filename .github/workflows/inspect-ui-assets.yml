name: Integrate reusable Godscar UI kit

on:
  push:
    branches:
      - ui/fight-skeleton
    paths:
      - .github/workflows/inspect-ui-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/fight-skeleton
          persist-credentials: true
      - name: Fetch pinned UI kit
        run: |
          curl -fL --retry 3 "https://raw.githubusercontent.com/fytchx/Godscar/ad17c6003bf5fcdd9e927ad42e7c251b2cb7858d/Godscar_UI_Reusable_Starter_Kit.zip" -o /tmp/godscar-ui-kit.zip
          mkdir -p /tmp/gs-kit
          unzip -q /tmp/godscar-ui-kit.zip -d /tmp/gs-kit
      - name: Apply GS-UI-1.0 without touching simulation
        run: |
          python -m py_compile scripts/apply_ui_kit.py
          python scripts/apply_ui_kit.py /tmp/gs-kit/godscar-ui-starter
      - name: Verify Fight screen HTML CSS JS and component paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          html = Path("index.html").read_text()
          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
                  self.ids = []
              def handle_starttag(self,t,a):
                  self.tags.append(t)
                  self.ids += [v for k,v in a if k=="id"]
          p=Tags()
          p.feed(html)
          assert "html" in p.tags and "body" in p.tags and "main" in p.tags
          assert len(p.ids)==len(set(p.ids)), "Duplicate IDs"
          for s in ("gs-ui-integration","gs-feed-shell","gs-progress","gs-nav-item","assets/ui/icons/settings.svg","assets/ui/icons/navigation.svg"):
              assert s in html,s
          for icon in re.findall(r'assets/ui/icons/[^"\s]+\.svg',html):
              assert Path(icon).is_file(),icon
          assert Path("assets/ui/godscar-ui.css").is_file()
          assert 'onclick="openZonePanel()"' in html
          assert "function toggleEnemy" in html and "function showRecap" in html
          assert "function cycleFight" in html and "setInterval(cycleFight,4200)" in html
          assert "<script src=\"sim.js\"" not in html
          match=re.search(r'<script>(.*?)</script>',html,re.S)
          assert match,"Script missing"
          Path("/tmp/fight-skeleton.js").write_text(match.group(1))
          print("HTML structure and kit asset references OK")
          PY
          node --check /tmp/fight-skeleton.js
          echo "JavaScript syntax OK"
          git diff --check
          echo "Available browser binaries:"
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
      - name: Commit packaged UI components to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ui
          git commit -m "Apply GS-UI-1.0 reusable components to Fight skeleton"
          git push origin HEAD:ui/fight-skeleton
