<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Godscar — Full UI Preview</title>
<style>
:root{
  color-scheme:dark; --bg:#0b0e12; --panel:#141a21; --panel2:#1a222c; --line:#303a46;
  --text:#e7e2d7; --muted:#8d98a5; --gold:#d1ad63; --red:#c64b4d; --blue:#6c9db5;
  --green:#71a77d; --purple:#ab85bb; --shadow:0 18px 50px #0008;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#29313a 0,#10151b 48%,#090c10 100%);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{width:min(100%,460px);min-height:100vh;margin:auto;background:linear-gradient(#11161c,#0d1116);border-inline:1px solid #252d36;box-shadow:var(--shadow);padding-bottom:90px;position:relative}
header{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{font:700 18px/1 Georgia,serif;letter-spacing:.16em;color:#eee4cd}
.brand small{display:block;color:var(--muted);font:600 9px/1.5 system-ui;letter-spacing:.22em;margin-top:5px}
.head-actions{display:flex;gap:8px}
.icon-btn{border:1px solid var(--line);background:#151b22;border-radius:10px;width:36px;height:36px;color:var(--gold)}
.ribbon{margin:0 14px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(110deg,#19212a,#12171e);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rib-label,.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.rib-value{font-size:12px;font-weight:700;margin-top:2px}
.meter{height:6px;background:#303943;border-radius:8px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--red)}
.meter.blue i{background:var(--blue)} .meter.gold i{background:var(--gold)}
.content{padding:0 14px}
.title-row{display:flex;justify-content:space-between;align-items:end;margin:8px 2px 12px}
h1{font:700 20px/1.1 Georgia,serif;letter-spacing:.02em;margin:0}
h2{font:700 13px/1.2 system-ui;margin:0}
.sub{color:var(--muted);font-size:11px;margin-top:4px}
.pill{border:1px solid #51482f;background:#211e17;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.1em;padding:5px 8px;border-radius:99px}
.card{border:1px solid var(--line);background:linear-gradient(140deg,#18212a,#12171e);border-radius:14px;padding:12px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.arena{aspect-ratio:1/1;border:1px solid #47515a;border-radius:15px;position:relative;overflow:hidden;background:
 radial-gradient(ellipse at 51% 52%,#27322e 0,#1b2423 32%,transparent 68%),
 linear-gradient(180deg,#26313a 0%,#192127 47%,#10151a 100%);box-shadow:inset 0 0 60px #0008}
.arena:before{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse at 50% 100%,#a27e3c16 0 28%,transparent 58%),
 repeating-linear-gradient(168deg,transparent 0 32px,#d0c59d08 33px 34px);opacity:.9}
.arena-top{position:absolute;left:12px;right:12px;top:11px;z-index:2;display:flex;justify-content:space-between;align-items:flex-start}
.arena-tag{background:#0c1116bd;border:1px solid #69705b66;border-radius:8px;padding:6px 8px;font-size:9px;letter-spacing:.11em;color:#d5c28d}
.inscription{width:115px}
.inscription .meter{height:4px;background:#45483e}
.inscription .meter i{background:linear-gradient(90deg,#d6b66a,#897145)}
.enemy-wrap{position:absolute;inset:21% 14% 18%;display:grid;place-items:center}
.enemy-glow{position:absolute;width:75%;height:68%;border-radius:50%;background:radial-gradient(ellipse,#b3443528,transparent 68%);filter:blur(5px)}
.enemy{width:76%;height:100%;max-height:285px;position:relative;filter:drop-shadow(0 9px 12px #0009)}
.arena-bottom{position:absolute;bottom:10px;left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;z-index:2}
.hp-block{width:54%;background:#0c1116d9;border:1px solid #48525a;border-radius:9px;padding:7px 9px}
.hp-block .meter{height:7px}
.dps{font:700 16px/1 Georgia,serif;color:#f0d38e;text-shadow:0 1px #000}
.casts{display:grid;gap:6px;margin:10px 0}
.cast{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;background:#151b21;border:1px solid #303943;border-radius:10px;padding:7px 9px}
.cast-icon{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:#382923;color:#e68a62;font-size:12px}
.cast.frost .cast-icon{background:#1b3039;color:#8ccde1}
.cast.holy .cast-icon{background:#3a3321;color:#ebd184}
.cast.attack .cast-icon{background:#252a30;color:#aab4bc}
.cast-name{font-size:11px;font-weight:700}
.cast-kind{font-size:9px;color:var(--muted)}
.cast .meter{height:4px;margin-top:4px;background:#303943}
.cast .meter i{background:linear-gradient(90deg,#b95d48,#e79561)}
.cast.frost .meter i{background:linear-gradient(90deg,#4c91aa,#8bd0de)}
.cast.holy .meter i{background:linear-gradient(90deg,#a88945,#edd28b)}
.cast.attack .meter i{background:#75818a}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:9px;border-radius:10px;background:#11171d;border:1px solid #2d3741}
.stat b{display:block;font-size:14px}.stat small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.enemy-copy{font-size:11px;color:#bbc3c8;display:flex;gap:8px;flex-wrap:wrap}
.enemy-copy span{border:1px solid #34404a;border-radius:99px;padding:4px 7px;background:#111820}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px;margin-bottom:11px;scrollbar-width:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#12181f;border-radius:8px;padding:7px 10px;color:var(--muted);font-size:10px;font-weight:700}
.tabs button.active{color:var(--gold);border-color:#78643b;background:#272319}
.equipment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{min-height:74px;border:1px solid #36414b;border-radius:11px;background:linear-gradient(145deg,#202a34,#151b22);padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.slot .slot-icon{font-size:22px;color:#c5b27f;line-height:1}
.slot label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#aeb7bf}
.slot small{font-size:8px;color:#d6c18a}
.gear-layout{display:grid;grid-template-columns:1fr 1.05fr;gap:8px}
.gear-portrait{border:1px solid #46505b;border-radius:12px;min-height:154px;background:radial-gradient(ellipse at 50% 35%,#536052 0,#28302e 42%,#151b20 75%);display:grid;place-items:center;position:relative;overflow:hidden}
.gear-portrait:after{content:attr(data-label);position:absolute;bottom:8px;color:#c9c3b3;font-size:8px;letter-spacing:.12em}
.item-card{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #35404a;background:#161d24;border-radius:10px;margin-bottom:7px}
.item-art{width:38px;height:38px;border-radius:9px;background:#28251d;border:1px solid #685a36;display:grid;place-items:center;color:#ddc47c;font-size:19px;flex:none}
.item-card b{font-size:11px;display:block}.item-card small{font-size:9px;color:var(--muted)}
.rarity{color:#d4b866!important}
.grid-items{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.bag-item{aspect-ratio:1;border:1px solid #3c4650;border-radius:10px;background:linear-gradient(145deg,#202a34,#12171d);display:grid;place-items:center;font-size:21px;position:relative}
.bag-item.selected{border-color:#d1ad63;background:#25241e}.bag-item:after{content:"";position:absolute;bottom:5px;left:5px;right:5px;height:2px;background:var(--rarity,#8b9aa8);border-radius:2px}
.skill-list{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px;border:1px solid #34404b;border-radius:10px;background:#161d24}
.skill-icon{width:34px;height:34px;border-radius:9px;background:#2a3027;display:grid;place-items:center;color:#dfc274;font-size:17px}
.skill p{margin:2px 0 0;color:var(--muted);font-size:9px}
.level{font-size:9px;color:var(--gold);font-weight:800}
.tree{display:flex;align-items:center;justify-content:space-around;padding:10px 4px}
.node{width:39px;height:39px;border-radius:50%;border:1px solid #5b5138;background:#28251d;display:grid;place-items:center;color:#dbc47f}
.node.lock{border-color:#34404b;background:#171d24;color:#65717c}
.connector{height:1px;background:#55492e;flex:1}
.costs{display:flex;gap:8px}.cost{flex:1;border:1px solid #36404a;border-radius:9px;padding:8px;background:#11171d;text-align:center;font-size:10px;color:#d9c47d}
.action{border:1px solid #80683b;background:linear-gradient(#4d4028,#302819);color:#f0d891;border-radius:9px;padding:9px 12px;font-size:10px;font-weight:800;letter-spacing:.08em}
.action:active{transform:translateY(1px)}
.action.secondary{background:#161d24;border-color:#394550;color:#c0c9cf}
.notice{font-size:9px;color:#87929b;padding:3px 2px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#0d1218f2;border-top:1px solid #303943;display:grid;grid-template-columns:repeat(5,1fr);z-index:10;backdrop-filter:blur(12px)}
.bottom-nav button{border:0;background:transparent;color:#84909c;display:grid;justify-items:center;gap:3px;padding:4px 0;font-size:9px;font-weight:700}
.bottom-nav button.active{color:var(--gold)}
.nav-icon{font-size:17px;line-height:1}
.toast{position:fixed;z-index:20;left:50%;bottom:86px;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:10px;background:#e1c77f;color:#171410;font-size:11px;font-weight:800;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:24px 0}.app{min-height:calc(100vh - 48px);border-radius:18px;overflow:hidden}.bottom-nav{bottom:24px;border-radius:0 0 18px 18px}}
.float-layer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}.float-damage{position:absolute;left:50%;top:43%;color:#ffe3a0;font:800 15px Georgia,serif;text-shadow:0 2px 4px #000;animation:float-up .95s ease-out forwards;white-space:nowrap}@keyframes float-up{to{opacity:0;transform:translateY(-44px)}}.status-chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 1px}.status-chip{border:1px solid #34404a;border-radius:99px;padding:3px 7px;background:#111820;color:#c5d0d4;font-size:9px}.status-chip.active{border-color:#80683b;color:#f1d98f}.hunt-card{padding:10px 12px}.death-reason{margin:0 0 9px;padding:7px 9px;border-left:2px solid var(--red);background:#261719;color:#f0b8ad;font-size:10px}.cast.locked{opacity:.62}.slot.selected{border-color:#9d8046;background:#24231e}.slot small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">GODSCAR<small>ASHEN ROAD · UI SHOWCASE</small></div>
    <div class="head-actions">
      <button class="icon-btn" aria-label="Settings" onclick="toast('Settings panel is a visual placeholder')">⚙</button>
    </div>
  </header>
  <section class="ribbon">
    <div><div class="rib-label">Veyra · Paladin</div><div class="rib-value">Level 18 <span style="color:var(--gold)">✦ 42</span></div></div>
    <div><div class="rib-label">Health</div><div class="rib-value">4,320 / 4,500</div><div class="meter"><i style="width:96%"></i></div></div>
    <div><div class="rib-label">Fallfields · Stage 12</div><div class="rib-value">12.4K Gold</div><div class="meter gold"><i style="width:68%"></i></div></div>
  </section>

  <main class="content" id="screen"></main>
  <nav class="bottom-nav" id="nav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>var module={exports:{}};</script><script src="./sim.js"></script><script>
const SIM=module.exports;
const tabs=[
  {id:"fight",name:"Fight",icon:"⚔"},
  {id:"gear",name:"Gear",icon:"♜"},
  {id:"bag",name:"Bag",icon:"▣"},
  {id:"build",name:"Build",icon:"✦"},
  {id:"forge",name:"Forge",icon:"⚒"}
];
let active="fight", forgeTab="Upgrade", bagTab="All", bagSelection=null, buildSpecReset=false, forgeSel="weapon", forgeCraftSlot="weapon", forgeRarity="common", forgeIlvl=1, forgeBase="", forgeSalvage=[];
const nav=document.getElementById("nav"), screen=document.getElementById("screen");
function toast(message){
  const t=document.getElementById("toast"); t.textContent=message; t.classList.add("show");
  clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}
function title(name,sub,right=""){
  return `<div class="title-row"><div><h1>${name}</h1><div class="sub">${sub}</div></div>${right}</div>`;
}
function cast(name,kind,icon,percent,klass=""){
  return `<div class="cast ${klass}"><div class="cast-icon">${icon}</div><div><div class="cast-name">${name}</div><div class="cast-kind">${kind}</div><div class="meter"><i style="width:${percent}%"></i></div></div><b style="font-size:9px;color:#aeb8c0">${percent}%</b></div>`;
}
function arena(){
 return `<div class="arena">
   <div class="arena-top">
    <div class="arena-tag">THE FALLFIELDS<br><span style="color:#e4ddd0;font-size:11px;letter-spacing:0">STAGE 12</span></div>
    <div class="arena-tag inscription"><span style="font-size:8px">ASHEN INSCRIPTION</span><div class="meter"><i style="width:63%"></i></div></div>
   </div>
   <div class="enemy-wrap"><div class="enemy-glow"></div>
    <svg class="enemy" viewBox="0 0 220 300" role="img" aria-label="Blighted Husk enemy silhouette">
     <defs><linearGradient id="armor" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#899081"/><stop offset=".48" stop-color="#454e48"/><stop offset="1" stop-color="#222b29"/></linearGradient></defs>
     <ellipse cx="111" cy="278" rx="73" ry="12" fill="#050809" opacity=".65"/>
     <path d="M84 52 64 26 99 37 113 17 132 39 162 27 146 64 162 82 154 101 167 128 151 143 166 184 144 204 157 256 121 260 108 217 92 262 58 254 77 203 57 180 70 145 55 126 70 97 57 81z" fill="#303a35" stroke="#9c9676" stroke-width="3"/>
     <path d="M80 74 107 56 140 71 148 104 130 125 84 117z" fill="url(#armor)" stroke="#aaa17d" stroke-width="2"/>
     <path d="M91 90 104 87 101 96 89 98zm31-1 14 3-10 8-8-3z" fill="#e9a75f"/>
     <path d="M79 131 109 120 139 132 151 173 128 192 83 184 65 165z" fill="#48534a" stroke="#a39b7b" stroke-width="3"/>
     <path d="M70 151 49 174 58 208 76 201 83 175zm71-4 25 18 15 33-18 9-24-34z" fill="#303934" stroke="#958d6f" stroke-width="3"/>
     <path d="M87 183 111 194 104 237 91 264 62 260 73 220zm38 4 22-6 11 40 18 32-28 9-27-42z" fill="#343d37" stroke="#a39876" stroke-width="3"/>
     <path d="M62 101 29 137 43 148 74 121zm79 5 34 25-9 14-35-21z" fill="none" stroke="#d0ad63" stroke-width="5" opacity=".75"/>
     <path d="M92 133 112 143 132 132" fill="none" stroke="#d0ad63" stroke-width="2" opacity=".7"/>
    </svg>
   </div>
   <div class="arena-bottom">
    <div class="hp-block"><div style="display:flex;justify-content:space-between;font-size:9px"><b>HUNT TARGET</b><span style="color:#d4c28d">LV 1</span></div><div class="meter"><i style="width:100%"></i></div><small style="color:#9ca6ae;font-size:8px">— / — HP</small></div>
    <div style="text-align:right"><div class="eyebrow">LIVE DPS</div><div class="dps">0</div></div>
   </div>
  </div>
  <div class="casts"></div>
  <div class="card">
   <div class="card-head"><h2>Enemy details</h2><span class="pill">ELITE</span></div>
   <div class="enemy-copy"><span></span></div>
  </div>
  <div class="pair">
   <div class="stat"><small>Experience</small><b>2,480 <span style="font-size:9px;color:var(--green)">+120</span></b></div>
   <div class="stat"><small>Next drop</small><b>Blight Shard</b></div>
  </div>
  <p class="notice">Visual reconstruction from the recorded UI direction. Combat values are illustrative.</p>`;
}
const gearIcons={weapon:"⚔",offhand:"⬟",helm:"♜",chest:"▰",gloves:"◈",belt:"◇",legs:"▥",boots:"⌑",ring1:"◉",ring2:"◉",amulet:"✥"};
const gearLabels={ring1:"Ring I",ring2:"Ring II"};
const slots=SIM.EQUIP.map(k=>[gearIcons[k]||"◇",gearLabels[k]||SIM.SLOT_NAMES[k],k]);
let gearSel="weapon";
function selectGearSlot(key){gearSel=key;render()}
function gearAction(type,id){
 const error=SIM.doAction(game,{type,id});
 toast(error|| (type==="upgrade"?"Item upgraded.":"Item unequipped."));
 render();
}
function gear(){
 const g=game,C=SIM.CLASSES[g.hero.cls],S=g.stats,used=SIM.EQUIP.filter(k=>g.equip[k]).length,it=g.equip[gearSel];
 const tiles=slots.map(([icon,label,key])=>{
   const item=g.equip[key];
   return '<button class="slot '+(gearSel===key?'selected':'')+'" onclick="selectGearSlot(\''+key+'\')"><span class="slot-icon">'+icon+'</span><label>'+label+'</label><small>'+(item?item.name:'Empty')+'</small></button>';
 }).join("");
 const lines=[];
 if(it){
   if(it.slot==="weapon"&&SIM.WEAPONS[it.base])lines.push(SIM.WEAPONS[it.base].name+" · "+SIM.fmt(it.dmg)+" base damage");
   if(it.def)lines.push(SIM.fmt(it.def)+" base armor");
   lines.push("Item level "+SIM.effIlvl(g,it)+" · "+SIM.RARITY_NAMES[it.rarity]+(it.plus?" · +"+it.plus:""));
   for(const [key,value] of it.affixes||[])if(SIM.AFFIXES[key])lines.push(SIM.AFFIXES[key].label(value));
   for(const key of it.augments||[])if(SIM.AUGMENTS[key])lines.push(SIM.AUGMENTS[key].name+" · "+SIM.AUGMENTS[key].text);
   if(it.enchant){const en=SIM.ENCHANTS[it.enchant[0]];if(en)lines.push(en.label(it.enchant[1]))}
 }
 const cost=it?SIM.upgradeCost(it):0;
 const activeSets=Object.entries(S.sets||{}).map(([key,n])=>SIM.SETS[key]?SIM.SETS[key].name+" · "+n+" piece"+(n===1?"":"s"):null).filter(Boolean);
 return title("Gear","Equipment · "+used+" / "+SIM.EQUIP.length+" equipped",'<span class="pill">'+C.name.toUpperCase()+'</span>')+
 '<div class="gear-layout"><div class="gear-portrait" data-label="'+C.name.toUpperCase()+' · LV '+g.hero.level+'"><svg width="105" height="130" viewBox="0 0 100 130" aria-label="'+C.name+' portrait"><path d="M33 20 50 7 68 20 73 41 65 53 75 64 84 114 65 121 50 94 36 121 16 114 26 64 36 53 27 41z" fill="#4f5a52" stroke="#b6a979" stroke-width="2"/><path d="M33 21 50 9 66 22 63 36 37 36z" fill="#8b8a71" stroke="#d0bc7b" stroke-width="2"/><path d="M36 51 50 45 65 52 69 76 50 87 31 76z" fill="#333d3b" stroke="#b1a77e" stroke-width="2"/><path d="M29 57 9 79 17 87 35 70zm37 0 21 15-5 10-22-13z" fill="#596158" stroke="#c2b480" stroke-width="2"/><path d="M51 49 51 81" stroke="#d6bd72" stroke-width="3"/></svg></div><div>'+
 '<div class="card" style="margin:0 0 7px"><div class="eyebrow">ARMOR</div><b style="font:700 19px Georgia">'+SIM.fmt(S.armor)+'</b><small style="display:block;color:var(--muted)">Including equipped gear</small></div>'+
 '<div class="card" style="margin:0 0 7px"><div class="eyebrow">STRENGTH</div><b style="font:700 19px Georgia">'+SIM.fmt(S.attr.STR)+'</b><small style="display:block;color:var(--muted)">Current total</small></div>'+
 '<div class="card" style="margin:0"><div class="eyebrow">LIFE</div><b style="font:700 19px Georgia">'+SIM.fmt(S.life)+'</b><small style="display:block;color:var(--muted)">Current maximum</small></div></div></div>'+
 '<div class="card" style="margin-top:9px"><div class="card-head"><h2>Equipment slots</h2><span class="sub">'+used+' equipped · tap to inspect</span></div><div class="equipment-grid">'+tiles+'</div></div>'+
 '<div class="card"><div class="card-head"><h2>'+SIM.SLOT_NAMES[gearSel]+' · '+(it?it.name:"Empty")+'</h2><span class="pill">'+(it?SIM.RARITY_NAMES[it.rarity].toUpperCase():"NO ITEM")+'</span></div>'+
 (it?'<div class="sub">'+lines.join('<br>')+'</div><div class="row" style="display:flex;gap:7px;margin-top:10px">'+(it.plus<10?'<button class="action secondary" onclick="gearAction(\'upgrade\',\''+it.id+'\')" '+(g.mats.shards<cost?'disabled':'')+'>UPGRADE · '+cost+' SHARDS</button>':'<span class="sub">Fully upgraded</span>')+(gearSel!=="weapon"?'<button class="action secondary" onclick="gearAction(\'unequip\',\''+it.id+'\')">UNEQUIP</button>':'')+'</div>':'<div class="sub">No item equipped in this slot. Equip items from Bag.</div>')+
 '<div class="sub" style="margin-top:9px">'+(activeSets.length?activeSets.join(' · '):"No equipment set bonuses active.")+'</div></div>';
}
const items=[
 ["⚔","Ashen Oath","Legendary sword","var(--gold)"],["⬟","Bulwark","Epic shield","var(--purple)"],["♜","Warden Helm","Rare helmet","var(--blue)"],["✥","Dawn Pendant","Rare amulet","var(--blue)"],
